<section class="promo-flip section" id="promo-flip-section" aria-label="عروض مميزة">
    <div class="container">
        <div class="promo-flip__header">
            <h2 class="section-title">عروض ما بتتفوّت 🔥</h2>
            <p class="promo-flip__sub">إضغط على الكرت وشوف تفاصيل العرض 👆</p>
        </div>
    </div>

    <div class="promo-flip__scroll hide-scrollbar" id="promo-flip-scroll">
        <div class="promo-flip__track" id="promo-flip-track">
            <!-- Cards are rendered here dynamically by scripts/promo-flip.js
                 from Firebase (promoFlipCards/*), configured from the admin
                 panel (لوحة الإدارة → كروت العروض). -->
        </div>
    </div>

    <div class="promo-flip__dots" id="promo-flip-dots"></div>
</section>
