<script type="module">
    import { distribute, startPage,getCategories,applyShopTheme } from './javascript/database.js';

    async function initializePage() 
	{
        try {
            // 1. Fill products first and wait for completion
            // 2. Now call other methods; products[] is guaranteed to be full
			const params = new URLSearchParams(window.location.search);
			const categories = params.getAll('category'); 
			const categories2 = params.getAll('category2'); 
			const pattern = params.getAll('pattern'); 
			const location = params.getAll('location'); 
			if(categories.length==1)
			{
				document.getElementById('company').innerHTML=categories[0];
				document.getElementById('company2').innerHTML=categories[0];
			}
			else 
			{
				document.getElementById('company').innerHTML=location[0];
				document.getElementById('company2').innerHTML=location[0];
			}
			if(categories2.length==0)
			{
				getCategories(document.getElementById('company').innerHTML);
			}
			else
			{
				await distribute(categories,categories2);
				getCategories(document.getElementById('company').innerHTML);
			}
			if(pattern.length==1)
			{
				applyShopTheme(pattern[0]);
			}
            startPage();
        } catch (error) {
            console.error("Initialization failed:", error);
        }
    }

    // Trigger initialization on load
    window.addEventListener('DOMContentLoaded', initializePage);
</script>

<div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Sign In</h5>
        <button type="button" 
                id="CP-Close-Btn"
                data-bs-dismiss="modal" 
                style="background: none; border: none; color: white; fontSize: 1.5rem; line-height: 1; opacity: 1; transition: opacity 0.2s ease; cursor: pointer;"
                onmouseover="this.style.opacity='0.5'" 
                onmouseout="this.style.opacity='1'">
          &times;
        </button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label small fw-bold">Username</label>
          <input type="text" id="loginUser" class="form-control">
        </div>
        <div class="mb-3">
          <label class="form-label small fw-bold">Password</label>
          <input type="password" id="loginPass" class="form-control">
        </div>
        <button type="button" id="loginBtn" class="btn btn-primary w-100 fw-bold">Login</button>
      </div>
    </div>
  </div>
</div>
<!-- Registration Modal -->
<div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="registerModalLabel">Create New Account</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="registrationForm">
          <div class="mb-3 position-relative">
            <label class="form-label">Username</label>
            <div class="d-flex align-items-center">
              <input type="text" class="form-control" id="username" placeholder="username" required autocomplete="off">
              <div id="username-status" class="ms-2" style="min-width: 100px; font-size: 0.85rem;"></div>
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" class="form-control" id="phone" placeholder="e.g. 76123456" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" id="password" required>
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" id="confirmPassword" required>
          </div>
          
          <!-- NEW: Location Toggle -->
          <div class="mb-3 form-check form-switch">
            <input class="form-check-input" type="checkbox" id="shareLocation">
            <label class="form-check-label" for="shareLocation">Share Live Location on Map</label>
          </div>

          <button type="submit" id="registerBtn" class="btn btn-primary w-100">Register</button>
        </form>
      </div>
    </div>
  </div>
</div>
