<!-- UNIQUE Password Modal -->
<div id="CP-Modal-Wrapper">
    <div id="CP-Modal-Content">
        <span id="CP-Close-Btn" onclick="hidePassModal()">&times;</span>
        <h2 style="margin-top:0; color:#3498db;">Change Password</h2>
        <form id="changePasswordForm">
            <input type="password" id="oldPassword" placeholder="Old Password" required>
            <input type="password" id="newPassword" placeholder="New Password" required>
            <input type="password" id="confirmPassword2" placeholder="Confirm New Password" required>
            <button type="submit" id="CP-Submit-Btn">Update Password</button>
        </form>
    </div>
</div>
