<div class="intro-container">
    <div class="logo-wrapper">
        <!-- Replace with your actual image paths -->
        <img src="png/motorcycle-only.png" class="motorcycle-icon" alt="Motorcycle">
        <div class="text-reveal">
            <img src="png/delivo-text-only.png" class="logo-text" alt="Delivo Logo">
            <p class="arabic-slogan"></p>
        </div>
    </div>
</div>
<style>
.intro-container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #fff;
    overflow: hidden;
}

.logo-wrapper {
    display: flex;
    align-items: center;
    position: relative;
}

/* 1. Motorcycle zooming in from the left */
.motorcycle-icon {
    width: 150px; 
    animation: zoomInBike 1.2s cubic-bezier(0.17, 0.67, 0.83, 0.67) forwards;
    z-index: 2;
}

/* 2. Text revealing from behind the bike */
.text-reveal {
    overflow: hidden;
    width: 0;
    white-space: nowrap;
    animation: revealText 0.8s ease-out 1s forwards;
    padding-left: 20px;
}

.logo-text {
    height: 60px;
}

.arabic-slogan {
    color: #0056b3; /* Matching your blue */
    font-size: 1.2rem;
    font-weight: bold;
    margin-top: 5px;
    opacity: 0;
    animation: fadeInSlogan 0.5s ease-in 1.5s forwards;
}

/* Animations */
@keyframes zoomInBike {
    0% {
        transform: translateX(-500px) scale(0.5);
        filter: blur(8px);
        opacity: 0;
    }
    70% {
        transform: translateX(20px) scale(1.1);
        filter: blur(0px);
        opacity: 1;
    }
    100% {
        transform: translateX(0) scale(1);
    }
}

@keyframes revealText {
    to { width: 400px; }
}

@keyframes fadeInSlogan {
    to { opacity: 1; transform: translateY(0); }
}
</style>
